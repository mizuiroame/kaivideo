name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # tests/Dockerfile: Debian 12's gcc with jansson and zlib (and the libraries of the other host tools).
      # The image's layers are kept in the Actions cache, so it is only
      # rebuilt when the Dockerfile changes.
      - name: Build the test image
        uses: docker/build-push-action@v6
        with:
          context: tests
          file: tests/Dockerfile
          tags: kaivideo-host
          load: true
          cache-from: type=gha,scope=kaivideo-host
          cache-to: type=gha,mode=max,scope=kaivideo-host

      # ASan/UBSan with ASLR off (setarch -R in tests/Makefile), which needs
      # seccomp=unconfined in Docker.
      - name: Run the tests
        run: docker run --rm --security-opt seccomp=unconfined -v "$PWD:/w" -w /w/tests kaivideo-host make run
